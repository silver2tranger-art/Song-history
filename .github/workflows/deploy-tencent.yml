name: Publish personal library to Tencent

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'images/**'
      - 'library/**'
      - '.github/workflows/deploy-tencent.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'images/**'
      - 'library/**'
      - '.github/workflows/deploy-tencent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-library-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publication boundaries and build public site
        run: |
          node --test library/tests/*.test.mjs
          python -m unittest discover -s library/tests -p 'test_*.py'
          node library/tools/build.mjs
          git diff --check

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Skip a superseded queued commit
        id: latest
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this queued deployment is skipped.'
          fi
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.current == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: steps.latest.outputs.current == 'true'
        with:
          python-version: '3.12'
      - name: Build only declared public assets
        if: steps.latest.outputs.current == 'true'
        run: node library/tools/build.mjs
      - name: Install official Tencent SDKs
        if: steps.latest.outputs.current == 'true'
        run: python -m pip install -r library/requirements-deploy.txt
      - name: Upload, remove withdrawn files, refresh and verify CDN
        if: steps.latest.outputs.current == 'true'
        env:
          PYTHONUNBUFFERED: '1'
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: python library/tools/deploy.py
